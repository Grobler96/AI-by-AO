# Runs every Monday at 06:10 UK time. Each run is capped at $15 of list cost.
name: aibyao-seo-weekly
agent: ./agent.md
environment_id: ./environment.yaml
resources:
  - ./memory_store-seo-log.yaml
# Fill in the vlt_... ID from claude-lock.json after applying vault.yaml and adding the GitHub token (see README).
vault_ids: []
schedule: {type: cron, expression: "10 6 * * 1", timezone: Europe/London}
budget: {type: limit, max_list_cost: {amount: "1500", currency: USD}}
initial_events:
  - type: user.define_outcome
    description: |
      Run this week's SEO review of www.aibyao.com: audit the site, make up to 6 evidenced, white hat improvements in a copy of the repo, prove they work, and open one pull request from a new seo/YYYY-MM-DD branch into main with a plain English report as its body (unless an earlier seo/ pull request is still open). Save the report to /mnt/session/outputs/ and append this run to seo-log.md in the memory store.
    max_iterations: 3
    rubric:
      type: text
      content: |
        - seo-report-YYYY-MM-DD.md exists in /mnt/session/outputs/ with today's date and has the sections: In one minute, Changes in this pull request, Health check, Opportunities for next time, Needs Oliver.
        - Either exactly one new pull request was opened from a branch named seo/YYYY-MM-DD into main and its body matches the report, or the report states that an earlier seo/ pull request is still open and no new one was opened.
        - Nothing was pushed to main and nothing was merged.
        - No more than 6 changes, each with its evidence and how to check it worked.
        - The audit script ran before and after the changes and reports zero errors afterwards; any new warning is explained.
        - Every JSON-LD block touched parses and only describes what is visible on the page; no address, phone, opening hours, reviews or ratings were invented.
        - Changed visible copy is British English with no em dashes, en dashes or hyphenated words, and makes no invented claims about AI by AO.
        - Animations, the contact form, the cookie banner and analytics code are unchanged, or the report explains a specific fix.
        - Every changed page has an updated sitemap lastmod, and every new page is in the sitemap, linked from at least one existing page, and copies the existing page structure.
        - PageSpeed Insights results (mobile at least) are recorded for the homepage, or the report says why they could not be fetched.
        - seo-log.md in the memory store has a new dated section for this run.
