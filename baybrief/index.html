<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BayBrief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a sticky 3D stage with the driver's brief beside it (stacked on phones).
   Look: hi-vis yellow on asphalt. Blue / red / green / yellow follow ISO safety-sign meaning. */
:root{
  --asphalt:#0f1215; --panel:#171c20; --panel2:#1f262b; --line:#2b343a; --ink:#edf1f3; --mute:#9aa7af;
  --hivis:#ffc400; --hivis-ink:#1a1500; --mand:#2e7de0; --stop:#e5483b; --safe:#2fb36d;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--asphalt);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1280px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.word{font:800 26px/1 var(--f-disp);letter-spacing:.06em}
.demo{font:600 11px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--hivis-ink);background:var(--hivis);padding:4px 7px;border-radius:3px}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:6px;padding:7px 11px;font:600 13px/1 var(--f-body);color:var(--mute);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--hivis);color:var(--hivis-ink)}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px}
.sel select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:600}

.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:20px;align-items:start}
.stage-col{position:sticky;top:max(10px,env(safe-area-inset-top,0px));z-index:5;min-width:0}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#cfd8dc;border:1px solid var(--line);aspect-ratio:16/10;max-height:calc(100vh - 170px);width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.nogl{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:24px;text-align:center;color:#223}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:600 12px/1 var(--f-body);background:rgba(15,18,21,.86);color:#fff;border-radius:6px;padding:6px 8px;white-space:nowrap;border:1px solid rgba(255,255,255,.18);will-change:transform}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;width:2px;height:6px;background:currentColor;opacity:.6}
.tag.hi{background:var(--hivis);color:var(--hivis-ink);border-color:transparent}
.tag.stop{background:var(--stop);border-color:transparent}
.tag.safe{background:var(--safe);border-color:transparent}
.tag.mand{background:var(--mand);border-color:transparent}
.hud{position:absolute;display:flex;gap:6px;align-items:center;z-index:2}
.hud.tl{left:10px;top:10px}
.hud.tr{right:10px;top:10px;background:rgba(15,18,21,.78);backdrop-filter:blur(6px)}
.hud.tr button{padding:6px 9px;font-size:12px}
.north{width:26px;height:26px;border-radius:50%;background:rgba(15,18,21,.8);display:grid;place-items:center;font:700 12px/1 var(--f-disp);color:var(--hivis);border:1px solid var(--line)}
.chip{font:600 12px/1 var(--f-body);background:rgba(15,18,21,.8);color:#fff;padding:7px 9px;border-radius:6px;border:1px solid var(--line)}
.caption{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,18,21,.88);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;z-index:2}
.caption .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--f-disp);background:var(--hivis);color:var(--hivis-ink)}
.caption h3{margin:0;font:700 17px/1.1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.caption p{margin:2px 0 0;font-size:13px;color:#cfd7dc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k-warn .n{background:var(--hivis)} .k-stop .n{background:var(--stop);color:#fff} .k-mand .n{background:var(--mand);color:#fff} .k-safe .n{background:var(--safe);color:#04170d}

.cabfx{position:absolute;inset:0;pointer-events:none;z-index:1}
.cabfx .dash{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#1b1f23,#0c0e10);border-top:3px solid #2a3036;clip-path:polygon(0 30%,18% 0,82% 0,100% 30%,100% 100%,0 100%)}
.cabfx .pillL,.cabfx .pillR{position:absolute;top:0;bottom:0;width:7%;background:linear-gradient(90deg,#0c0e10,#1b1f23)}
.cabfx .pillL{left:0;clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.cabfx .pillR{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.cabfx .roof{position:absolute;left:0;right:0;top:0;height:6%;background:#0c0e10;margin:0}
.cabfx .mirror{position:absolute;inset:3% 3% 3% 3%;border:10px solid #0c0e10;border-radius:18px;box-shadow:inset 0 0 0 2px #333,0 0 0 2000px rgba(0,0,0,.0)}
.cabfx .mlabel{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);font:700 11px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.6);padding:5px 8px;border-radius:4px}

.transport{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.tr-row{display:flex;align-items:center;gap:10px}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--hivis);color:var(--hivis-ink);display:grid;place-items:center}
.play svg{width:18px;height:18px}
.scrub{position:relative;flex:1;min-width:0;height:34px;display:flex;align-items:center}
.scrub input{width:100%;margin:0;accent-color:var(--hivis);height:34px;background:none;position:relative;z-index:2}
.marks{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none;z-index:1}
.marks i{position:absolute;top:-9px;width:2px;height:18px;background:var(--line);transform:translateX(-1px)}
.marks i.on{background:var(--hivis)}
.time{font:600 13px/1 var(--f-body);color:var(--mute);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.speed{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--f-body)}
.opt[aria-pressed=true]{background:rgba(255,196,0,.14);border-color:var(--hivis);color:var(--hivis)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;background:none;border:0;padding:13px 8px;font:700 15px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hivis)}
.pane{padding:16px}
.pane[hidden]{display:none}
.h{font:800 22px/1.05 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;margin:0 0 10px}
.eyebrow{font:600 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.job{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.job div{background:var(--panel2);padding:9px 11px;min-width:0}
.job dt{font:600 10.5px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.job dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.job .bay dd{font:800 26px/1 var(--f-disp);color:var(--hivis);letter-spacing:.04em}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.step{border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.step>button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--f-disp);background:var(--line);color:var(--ink)}
.step .t{font:700 16px/1.1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.step .b{display:none;padding:0 12px 12px 50px;color:#cdd6db;font-size:14.5px}
.step.cur{border-color:var(--hivis)}
.step.cur .b{display:block}
.step.cur .n{background:var(--hivis);color:var(--hivis-ink)}
.step.k-stop.cur .n{background:var(--stop);color:#fff}.step.k-mand.cur .n{background:var(--mand);color:#fff}.step.k-safe.cur .n{background:var(--safe);color:#04170d}
.step.done .n{background:#3a444b;color:var(--mute)}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--hivis);transition:width .3s}
.rule{border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:6px;overflow:hidden}
.rule>button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 12px}
.rule .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--f-disp);color:#fff;background:var(--mand)}
.rule .t{font:700 16px/1.1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.rule .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.rule.read .tick{background:var(--safe);border-color:var(--safe);color:#04170d}
.rule .body{display:none;padding:0 12px 12px}
.rule.cur{border-color:var(--hivis)} .rule.cur .body{display:block}
.rule ul{margin:0 0 12px;padding-left:18px;color:#d6dde1} .rule li{margin:4px 0}
.btn{border:0;border-radius:8px;padding:11px 16px;font:700 14px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;background:var(--hivis);color:var(--hivis-ink)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.gate{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--mute);font-size:14px;margin-top:14px}
.q{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.q p{margin:0 0 8px;font-weight:600}
.opt-a{display:block;width:100%;text-align:left;margin:5px 0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);}
.opt-a.ok{border-color:var(--safe);background:rgba(47,179,109,.14)}
.opt-a.no{border-color:var(--stop);background:rgba(229,72,59,.14)}
.fb{font-size:13.5px;margin:6px 0 0;color:var(--mute)}
.fb.ok{color:#6fd9a0}.fb.no{color:#ff8f84}
.form{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:5px;font:600 11px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.form input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:15px;color:var(--ink);min-width:0}
.sig{width:100%;height:150px;background:#f4f1e8;border-radius:8px;touch-action:none;display:block}
.receipt{border:2px solid var(--safe);border-radius:12px;padding:14px;background:rgba(47,179,109,.08)}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}
.receipt dt{color:var(--mute);font-size:13px}.receipt dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.docket-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.paper{background:#f2efe6;color:#1b1e20;border-radius:6px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.45);position:relative;font-family:var(--f-body)}
.paper::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:repeating-linear-gradient(135deg,#1b1e20 0 10px,var(--hivis) 10px 20px);border-radius:6px 6px 0 0}
.paper h2{font:800 28px/1 var(--f-disp);letter-spacing:.05em;margin:8px 0 2px;text-transform:uppercase}
.paper .sub{color:#555c60;font-size:13px;margin:0 0 14px}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper td{padding:6px 0;border-bottom:1px solid #d6d2c6;vertical-align:top}
.paper td:first-child{font:600 11px/1.6 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:#5c6266;width:34%}
.qrbox{display:grid;gap:8px;justify-items:center;padding:14px;margin-top:14px;border:2px solid #1b1e20;border-radius:8px;background:#fff}
.qrbox svg{width:min(210px,100%);height:auto;display:block}
.qrbox b{font:800 15px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.qrbox code{font-size:11px;color:#555;overflow-wrap:anywhere;text-align:center}
.side h3{font:800 18px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
.side p,.side li{color:#cdd6db;font-size:14.5px}
.side ul{padding-left:18px;margin:0 0 14px}
pre.code{margin:0 0 14px;background:#0b0e10;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c8e0cf;max-width:100%}
.note{font-size:12.5px;color:var(--mute)}

.layout[data-tab=docket]{grid-template-columns:minmax(0,1fr)}
.layout[data-tab=docket] .stage-col{display:none}

@media (max-width:959px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage-col{top:env(safe-area-inset-top,0px);padding-top:6px;background:var(--asphalt)}
  .stage{aspect-ratio:4/3;max-height:40vh}
  .docket-wrap{grid-template-columns:minmax(0,1fr)}
  .caption p{-webkit-line-clamp:1}
}
@media (max-width:520px){
  .hud.tr button{padding:6px 7px;font-size:11px}
  #vehChip{display:none}
  .word{font-size:22px}
  .form{grid-template-columns:minmax(0,1fr)}
  .caption{padding:7px 9px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#ffc400"/><path d="M8 25V12l9-5 9 5v13" fill="none" stroke="#1a1500" stroke-width="3" stroke-linejoin="round"/><path d="M13 25v-8h8v8" fill="#1a1500"/></svg>
      <span class="word">BAYBRIEF</span><span class="demo" id="demoTag">Demo site</span>

    <div class="top-r">

    <section class="panel" id="panel">

function buildRoute(k){
  const bx=bayX(k.bay), zEnd=SITE.dock+0.35+k.tailOH;
  // reverse arc (relative), curvature ramps in and out so the cab swings smoothly
  const R=k.Rrev, ramp=4, kap=1/R, arcLen=PI/2*R+ramp;
  const arc=[{x:0,z:0,m:0,k:0}];
  {let x=0,z=0,m=0; const n=Math.ceil(arcLen/DS), d=arcLen/n;
   for(let i=1;i<=n;i++){const sm=(i-.5)*d, kk=kap*Math.min(1,sm/ramp,(arcLen-sm)/ramp); const mm=m-kk*d/2; x+=Math.cos(mm)*d; z+=Math.sin(mm)*d; m-=kk*d; arc.push({x,z,m,k:kk});}}
  function gen(stopX){
    const pts=[]; let x=-85,z=SITE.laneZ,ph=0,s=0; const mark={};
    const push=v=>pts.push({x,z,ph,s,v,dir:1});

function renderRules(){
  const ui=L.ui, n=ssow.read.size, m=L.rules.length; let h='<h2 class="h">'+ui.rulesHead+'</h2><p class="note" style="margin:0 0 10px">'+ui.rulesIntro+'</p>';

  const kinds=['#d6262b','#2e7de0','#2fb36d','#e5483b','#ffc400','#2fb36d'];
  L.rules.forEach((r,i)=>{const rd=ssow.read.has(i);
    h+='<div class="rule'+(i===ruleIdx?' cur':'')+(rd?' read':'')+'" data-i="'+i+'"><button type="button"><span class="ico" style="background:'+kinds[i]+(i===4?';color:#1a1500':'')+'">'+(i+1)+'</span><span class="t">'+r[0]+'</span><span class="tick">'+(rd?'✓':'')+'</span></button><div class="body"><ul>'+r[1].map(x=>'<li>'+x+'</li>').join('')+'</ul><button type="button" class="btn'+(rd?' ghost':'')+'" data-got="'+i+'">'+(rd?ui.read+' ✓':ui.gotIt)+'</button></div></div>';});
  const all=n===m;
  h+='<h2 class="h" style="margin-top:20px">'+ui.quizHead+'</h2>';
  if(!all) h+='<div class="gate">'+ui.quizLocked+'</div>';

    L.quiz.forEach((q,qi)=>{const ans=ssow.answers[qi]; h+='<div class="q" data-q="'+qi+'"><p>'+(qi+1)+'. '+q.q+'</p>'+q.o.map((o,oi)=>{let c='opt-a'; if(ans!==undefined){ if(oi===ans) c+=(oi===q.a?' ok':' no'); else if(oi===q.a&&ans===q.a) c+=''; } return '<button type="button" class="'+c+'" data-o="'+oi+'">'+o+'</button>';}).join('')+(ans===undefined?'':(ans===q.a?'<p class="fb ok">'+ui.right+' '+q.e+'</p>':'<p class="fb no">'+ui.wrong+'</p>'))+'</div>';}); }

  else h+='<div class="form"><label class="full" for="fName">'+ui.fName+'<input type="text" id="fName" autocomplete="off" placeholder="'+ui.phName+'" value="'+esc(ssow.name)+'"></label><label for="fCo">'+ui.fCo+'<input type="text" id="fCo" autocomplete="off" placeholder="'+ui.phCo+'" value="'+esc(ssow.co)+'"></label><label for="fReg">'+ui.fReg+'<input type="text" id="fReg" autocomplete="off" placeholder="'+ui.phReg+'" value="'+esc(ssow.reg)+'"></label><div class="full"><label for="sig" style="margin-bottom:5px">'+ui.fSig+'</label><canvas id="sig" class="sig"></canvas></div><div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="signBtn" disabled>'+ui.signBtn+'</button><button type="button" class="btn ghost" id="sigClear">'+ui.clear+'</button></div></div>';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function checkSign(){const b=$('#signBtn'); if(b) b.disabled=!(ssow.name.trim()&&ssow.co.trim()&&ssow.reg.trim()&&ssow.ink);}
let sigCtx=null, drawing=false;
function initSig(){const c=$('#sig'); if(!c) return; const dpr=window.devicePixelRatio||1, w=c.clientWidth||300, h=150; c.width=w*dpr;c.height=h*dpr; sigCtx=c.getContext('2d'); sigCtx.scale(dpr,dpr); sigCtx.lineWidth=2.4;sigCtx.lineCap='round';sigCtx.strokeStyle='#14181b'; ssow.ink=false;
  const pt=e=>{const r=c.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pt(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault();};
  c.onpointermove=e=>{if(!drawing)return;const [x,y]=pt(e);sigCtx.lineTo(x,y);sigCtx.stroke();ssow.ink=true;checkSign();};
  c.onpointerup=c.onpointercancel=()=>{drawing=false;};
  $('#sigClear').onclick=()=>{sigCtx.clearRect(0,0,c.width,c.height);ssow.ink=false;checkSign();};
  $('#fName').oninput=e=>{ssow.name=e.target.value;checkSign();}; $('#fCo').oninput=e=>{ssow.co=e.target.value;checkSign();}; $('#fReg').oninput=e=>{ssow.reg=e.target.value;checkSign();};
  $('#signBtn').onclick=()=>{const when=new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}); let hsh=0; const sstr=ssow.name+ssow.reg+when; for(let i=0;i<sstr.length;i++) hsh=(hsh*31+sstr.charCodeAt(i))>>>0;
    ssow.done={name:ssow.name,co:ssow.co,reg:ssow.reg.toUpperCase(),when,attempts:ssow.attempts+' wrong',ref:'BB-'+hsh.toString(16).toUpperCase().padStart(8,'0')}; if(ssow.attempts===0) ssow.done.attempts='first time'; renderRules(); $('#p-rules').scrollIntoView({block:'end',behavior:'smooth'});};
}
$('#p-rules').addEventListener('click',e=>{
  const rb=e.target.closest('.rule>button'); if(rb){ruleIdx=+rb.parentNode.dataset.i; ruleClock=0; renderRules(); return;}
  const gb=e.target.closest('[data-got]'); if(gb){const i=+gb.dataset.got; ssow.read.add(i); if(i<L.rules.length-1) {ruleIdx=i+1; ruleClock=0;} renderRules(); return;}
  const ob=e.target.closest('.opt-a'); if(ob){const qi=+ob.closest('.q').dataset.q, oi=+ob.dataset.o; if(oi!==L.quiz[qi].a) ssow.attempts++; ssow.answers[qi]=oi; ssow.quizOk=L.quiz.every((q,i)=>ssow.answers[i]===q.a); renderRules(); return;}

});

/* ---- docket + QR ---- */
function qrSvg(text){
  try{const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); let d=''; for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+='M'+(c+4)+' '+(r+4)+'h1v1h-1z'; return '<svg viewBox="0 0 '+(n+8)+' '+(n+8)+'" role="img" aria-label="QR code" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';}
  catch(e){return '<p>QR</p>';}
}

  +'<div class="side"><h3>'+ui.howHead+'</h3><ul>'+ui.how.map(x=>'<li>'+x+'</li>').join('')+'</ul><pre class="code">'+esc(json)+'</pre><p class="note">The QR sits on the delivery note and the dispatch email. It opens a web page, so there is nothing to install. The brief is cached for yards with poor signal.</p></div></div>';
  $('#scanBtn').onclick=()=>{setTab('route'); setKind(kindId); window.scrollTo({top:0,behavior:'smooth'});};

  if(t==='route'){lastStep=-1; resetPallets();}
  resize();
}
function updateRuleCaption(){const r=L.rules[ruleIdx]; const cap=$('#caption'); cap.className='caption k-'+['stop','mand','safe','stop','warn','safe'][ruleIdx]; cap.innerHTML='<span class="n">'+(ruleIdx+1)+'</span><div><h3>'+r[0]+'</h3><p>'+r[1][0]+'</p></div>';}

/* ---- events ---- */
$('#vehSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b&&b.dataset.k!==kindId){setKind(b.dataset.k); if(tab==='docket') renderDocket(); if(tab==='rules') renderRules();}});
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b){view=b.dataset.v; cam.orb.az=0;cam.orb.el=0;cam.orb.zoom=1; updateChips();}});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setTab(b.dataset.t);});
$('#lang').addEventListener('change',e=>{LANG=e.target.value; L=I18N[LANG]; try{localStorage.setItem('bb-lang',LANG);}catch(_){} document.documentElement.lang=L.code; updateChips(); textLabels(); renderRoute(); renderRules(); renderDocket(); if(tab==='rules') updateRuleCaption();});
$('#p-route').addEventListener('click',e=>{const s=e.target.closest('.step'); if(s){const i=+s.dataset.i; tNow=Math.min(TL.dur,TL.stepT[i]+.05); playing=false; setPlayUI();}});
const playBtn=$('#playBtn');
function setPlayUI(){const atEnd=tNow>=TL.dur-.05; $('#playIco').innerHTML=playing?'<path d="M3 2h4v14H3zM11 2h4v14h-4z" fill="currentColor"/>':(atEnd?'<path d="M9 3a6 6 0 1 1-5.7 4H1l3.5-4L8 7H5.4A4 4 0 1 0 9 5z" fill="currentColor"/>':'<path d="M4 2l12 7-12 7z" fill="currentColor"/>'); playBtn.setAttribute('aria-label',playing?L.ui.pause:(atEnd?L.ui.replay:L.ui.play));}
playBtn.onclick=()=>{ if(tNow>=TL.dur-.05){tNow=0;playing=true;} else playing=!playing; if(!playing&&'speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}} setPlayUI();};
$('#scrub').addEventListener('input',e=>{tNow=e.target.value/1000*TL.dur; playing=false; setPlayUI();});

// orbit
{let down=null; const cv=$('#gl'); cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,az:cam.orb.az,el:cam.orb.el}; cv.setPointerCapture(e.pointerId);});
 cv.addEventListener('pointermove',e=>{if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; cam.orb.az=down.az-dx*.008; cam.orb.el=clamp(down.el+dy*.2,-30,25);});
 cv.addEventListener('pointerup',()=>{down=null;}); cv.addEventListener('pointercancel',()=>{down=null;});
 cv.addEventListener('wheel',e=>{e.preventDefault(); cam.orb.zoom=clamp(cam.orb.zoom*(1+Math.sign(e.deltaY)*.08),.4,2);},{passive:false});}

function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stageEl); window.addEventListener('resize',resize);

/* =====================================================================
   LOOP
   ===================================================================== */
let last=performance.now(), reduce=false; try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(tab==='docket') return;
  let st,pose,mode;
  if(tab==='route'){
    mode='route'; if(playing){tNow+=dt*speedMul; if(tNow>=TL.dur){tNow=TL.dur;playing=false;setPlayUI();}}
    st=routeState(tNow); pose=st.p; setStepUI(st.step);
    $('#scrub').value=Math.round(tNow/TL.dur*1000); $('#timeLbl').textContent=fmt(tNow)+' / '+fmt(TL.dur);
    applyVehicle(pose,veh,st.holdT,st.brake,st.hz,st.rev);
    applyForklift(st.holdT-3.2);
    veh.revZone.visible=st.step===6&&st.holdT<=0;
    zoneDock.visible=st.step===7; zoneCar.visible=st.step===4; zoneWalkNo.visible=false; walkGroup.visible=st.step>=7; emerGroup.visible=false;
    speedSprites.forEach(s=>s.visible=false); ring.visible=false; asmSign.visible=false;
    barrierPivot.rotation.z=-ss(barrierAmt(tNow))*1.35;
    applyActors(st,tNow,'route',-1);
  }else{
    mode='ssow'; ruleClock+=dt; const rule=ruleIdx; let holdT=-1;
    if(rule===3){ const t0=TL.tFwd, t1=TL.tHold, tt=t0+(ruleClock%((t1-t0)+3)); st=routeState(Math.min(tt,t1)); st.step=6; st.holdT=-1; }
    else{ st={p:poseAt(R,R.sMax),v:0,brake:false,holdT:-1,step:7,rev:false,hz:false}; if(rule===4) holdT=3.2+(ruleClock%46); else if(rule===2||rule===5) holdT=30; }
    pose=st.p; applyVehicle(pose,veh,holdT,st.brake,rule===3||rule===4,st.rev);
    if(rule===4) applyForklift(holdT-3.2-1); else { applyForklift(-1); if(rule!==3&&rule!==4) resetPallets(); }
    veh.revZone.visible=rule===3; zoneDock.visible=rule===4; zoneCar.visible=rule===0; zoneWalkNo.visible=rule===2;
    walkGroup.visible=rule===1||rule===2||rule===4; emerGroup.visible=rule===5;
    speedSprites.forEach(s=>s.visible=rule===0); ring.visible=asmSign.visible=rule===5;
    barrierPivot.rotation.z=0; applyActors(st,ruleClock,'ssow',rule);
  }
  // camera
  if(!cam.init) cam.hd=pose.ph; cam.hd=lerp(cam.hd,pose.ph,1-Math.exp(-dt*2.2));
  desiredCam(st,pose,mode,ruleIdx);
  const isCab=view==='cab'&&mode==='route';
  if(!cam.init||isCab){cam.pos.copy(eye);cam.tgt.copy(look);cam.init=true;} else {const k=1-Math.exp(-dt*(mode==='ssow'?2.4:2.8)); cam.pos.lerp(eye,k); cam.tgt.lerp(look,k);}
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt); const fov=isCab?(camera.userData.mirror?55:62):42; if(camera.fov!==fov){camera.fov=fov;} camera.updateProjectionMatrix();
  const fx=$('#cabfx'); fx.hidden=!isCab; if(isCab){const m=!!camera.userData.mirror; ['.dash','.pillL','.pillR','.roof'].forEach(q=>{$(q,fx).style.display=m?'none':'';}); $('#mirrorFx').style.display=m?'':'none'; $('#mirrorLbl').style.display=m?'':'none';}
  sun.target.position.set(cam.tgt.x,0,cam.tgt.z); sun.position.set(cam.tgt.x-45,80,cam.tgt.z+35); sun.target.updateMatrixWorld();
  const pu=.5+.5*Math.sin(now/260); glowMats[0].opacity=.55+.45*pu; glowMats[1].opacity=.12+.2*pu; ring.scale.setScalar(1+.12*pu);
  if(!reduce){texYellow.offset.x-=dt*.9; texRed.offset.x-=dt*.9; texGreen.offset.x-=dt*.9;}
  routeGroup.userData.rb2.visible=routeGroup.visible&&(tab==='route'||ruleIdx===3);
  let show=mode==='route'?STEP_LABELS[st.step]:RULE_LABELS[ruleIdx]; if(view==='site'&&mode==='route') show=show.concat(['bay']);
  projectLabels(show);
  renderer.render(scene,camera);
}
// init (wait briefly for the display fonts so painted signs use them)
function boot(){

}
